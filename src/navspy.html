<!-- Shared by the case pages (inlined by build.py): highlights the section you are reading in the sticky top nav, shows reading progress,
     and offers "← Back" to return to where you were before jumping to a section (button, Alt+← or the browser's back). -->
<style>
.nav { position: sticky; }
.nav a.active { background: var(--ink); color: var(--bg); }
.nav a.active:hover { background: var(--ink); color: var(--bg); }
.nav .progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--focus); transform-origin: 0 50%; transform: scaleX(0); }
.backjump { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 12;
  font: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 14px; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 24px rgb(15 23 42 / .16); }
.backjump:hover { border-color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) { .nav a { transition: background .15s, color .15s; } }
</style>
<script>
(function () {
  const nav = document.querySelector(".nav");
  if (!nav) return;
  const row = nav.querySelector(".wrap");
  const links = [...nav.querySelectorAll('a[href^="#"]')];
  const pairs = links.map(a => [a, document.getElementById(a.getAttribute("href").slice(1))]).filter(p => p[1]);
  const bar = document.createElement("div");
  bar.className = "progress";
  bar.setAttribute("aria-hidden", "true");
  nav.appendChild(bar);
  let current = null, ticking = false;

  function update() {
    ticking = false;
    const line = nav.getBoundingClientRect().bottom + 24;
    let active = null;
    for (const [a, sec] of pairs) if (sec.getBoundingClientRect().top <= line) active = a;
    const atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
    if (atEnd && pairs.length) active = pairs[pairs.length - 1][0];
    if (active !== current) {
      if (current) { current.classList.remove("active"); current.removeAttribute("aria-current"); }
      if (active) {
        active.classList.add("active");
        active.setAttribute("aria-current", "location");
        // keep the active link visible in the horizontally scrolling nav (phones) without moving the page
        const left = active.offsetLeft - (row.clientWidth - active.offsetWidth) / 2;
        row.scrollTo({ left: Math.max(0, left), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      }
      current = active;
    }
    const max = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ")";
  }
  // one step back: remember the scroll position before every in-page jump
  const ru = (document.documentElement.lang || "ru").slice(0, 2) === "ru";
  const back = document.createElement("button");
  back.type = "button"; back.className = "backjump"; back.hidden = true;
  back.textContent = ru ? "\u2190 \u041d\u0430\u0437\u0430\u0434" : "\u2190 Back";
  back.title = ru ? "\u0412\u0435\u0440\u043d\u0443\u0442\u044c\u0441\u044f \u0442\u0443\u0434\u0430, \u0433\u0434\u0435 \u0432\u044b \u0431\u044b\u043b\u0438 \u00b7 Alt + \u2190" : "Return to where you were \u00b7 Alt + \u2190"; // RU text escaped so English pages stay Cyrillic-free
  document.body.appendChild(back);
  const jumps = [];
  const sync = () => { back.hidden = !jumps.length; };
  document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener("click", () => {
    if (a.getAttribute("href").length < 2) return;
    jumps.push({ y: window.scrollY, h: location.hash }); if (jumps.length > 50) jumps.shift(); sync();
  }));
  function goBack() {
    if (!jumps.length) return;
    const y = jumps.pop().y;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    window.scrollTo({ top: y, behavior: "auto" });
    sync();
  }
  back.addEventListener("click", goBack);
  // the browser's own back: drop the jump it just undid (clicking a link also fires popstate, so compare hashes)
  window.addEventListener("popstate", () => { if (jumps.length && location.hash === jumps[jumps.length - 1].h) { jumps.pop(); sync(); } });
  document.addEventListener("keydown", e => { if (e.altKey && e.key === "ArrowLeft" && jumps.length) { e.preventDefault(); goBack(); } });

  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();
})();
</script>
